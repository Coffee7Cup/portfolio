<!-- turn off the Caret Browsing (Settings -> Accessibility) to use arrow keys to scroll -->

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Preconnect to external origins for faster font/resource loading -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

		<!-- Theme color for browser chrome (matches dark bg) -->
		<meta name="theme-color" content="#0f0b06" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fffdfa" media="(prefers-color-scheme: light)" />

		<!-- Prevent automatic phone/email/address detection -->
		<meta name="format-detection" content="telephone=no" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
